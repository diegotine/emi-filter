[package]
name = "emi-filter"
version = "1.3.0"
edition = "2021"
rust-version = "1.88"
description = "Simulador nativo do filtro EMI bifásico com análise DM e CM"
license = "MIT"
repository = "https://github.com/diegotine/emi-filter"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
